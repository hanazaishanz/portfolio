name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - style/**
      - script/**
      - preview/**
      - package.json
      - package-lock.json
      - .nojekyll
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build production CSS
        run: |
          npm ci
          npm run check
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/style
          cp index.html .nojekyll _site/
          cp -R assets script preview _site/
          cp style/syling.css _site/style/
          cp -R style/fonts _site/style/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
